seed: 42

paths:
  chapter3_prediction_candidates:
    - D:/pythonProject2/outputs/chapter3_repro/metrics/test_predictions.csv
    - D:/pythonProject2/outputs/chapter3_full_repro_20260408/chapter3_repro/metrics/test_predictions.csv
    - D:/pythonProject2/outputs/00_论文总目录_最终版/01_用户训练结果/第三章_LUAE/chapter3_repro/metrics/test_predictions.csv
  chapter3_checkpoint_candidates:
    - D:/pythonProject2/outputs/chapter3_repro/checkpoints/best_model.pt
    - D:/pythonProject2/outputs/chapter3_full_repro_20260408/chapter3_repro/checkpoints/best_model.pt
    - D:/pythonProject2/outputs/00_论文总目录_最终版/01_用户训练结果/第三章_LUAE/chapter3_repro/checkpoints/best_model.pt
  chapter3_config: D:/pythonProject2/configs/chapter3_luae.yaml
  output_root: D:/pythonProject2/outputs/chapter5_system_validation_20260410
  thesis_output_roots:
    - D:/pythonProject2/outputs/00_论文总目录_最终版/05_第五章输出/99_最终投稿版

sampling:
  allow_replacement: true
  connectivity:
    counts:
      normal: 50
      slight_local: 50
      edge_leakage: 50
      medium_diffuse: 50
      severe_global: 50
  control_logic:
    counts:
      slight_local: 45
      edge_leakage: 45
      medium_diffuse: 45
      severe_global: 45
  realtime:
    counts:
      normal: 20
      slight_local: 20
      edge_leakage: 20
      medium_diffuse: 20
      severe_global: 20

interface:
  severity_thresholds:
    normal_score_ratio: 0.92
    normal_defect_ratio: 0.008
    slight_score_ratio: 1.08
    slight_defect_ratio: 0.020
    medium_score_ratio: 1.32
    medium_defect_ratio: 0.040
  archetype_thresholds:
    edge_margin: 0.18
    severe_defect_ratio: 0.050
    severe_bbox_area_ratio: 0.012
    diffuse_bbox_area_ratio: 0.006
  zone_thresholds:
    left: 0.36
    right: 0.64

control_standard:
  base_parameters:
    flow_g_per_15s: 50.0
    pressure_mpa: 0.32
    spray_angle_deg: 90.0
  limits:
    flow_g_per_15s: [45.0, 60.0]
    pressure_mpa: [0.24, 0.42]
    spray_angle_deg: [60.0, 120.0]
  score_gap_scale: 0.35
  defect_ratio_scale: 0.06
  residual_scale: 0.09
  profiles:
    normal:
      action: 闭环稳态保持
      flow_delta: 0.0
      flow_gain: 0.6
      pressure_delta: 0.000
      pressure_gain: 0.002
      angle_mode: hold
      angle_delta: 0.0
      angle_gain: 0.0
      require_alarm: false
    slight_local:
      action: 局部靶向补喷
      flow_delta: 7.2
      flow_gain: 1.2
      pressure_delta: 0.015
      pressure_gain: 0.003
      angle_mode: narrow
      angle_delta: 18.0
      angle_gain: 2.0
      require_alarm: false
    edge_leakage:
      action: 边缘定向补喷
      flow_delta: 6.5
      flow_gain: 1.0
      pressure_delta: 0.013
      pressure_gain: 0.004
      angle_mode: narrow
      angle_delta: 20.0
      angle_gain: 2.5
      require_alarm: false
    medium_diffuse:
      action: 区域增益补偿
      flow_delta: 5.0
      flow_gain: 1.4
      pressure_delta: 0.020
      pressure_gain: 0.005
      angle_mode: narrow
      angle_delta: 10.0
      angle_gain: 2.0
      require_alarm: false
    severe_global:
      action: 异常预警+全区域参数修正
      flow_delta: 8.5
      flow_gain: 1.5
      pressure_delta: 0.030
      pressure_gain: 0.006
      angle_mode: widen
      angle_delta: 8.0
      angle_gain: 3.0
      require_alarm: true

controller:
  ema_alpha: 0.70
  adaptive_rate: 0.32
  severity_gain:
    normal: 0.15
    slight: 0.75
    medium: 1.00
    severe: 1.25
  weights:
    score_gap: 0.52
    defect_ratio: 0.28
    residual_mean: 0.20
  flow_adaptive_gain: 1.2
  pressure_adaptive_gain: 0.004
  angle_adaptive_gain: 2.0
  command_blend: 0.68
  alarm_score_gap: 0.22
  alarm_defect_ratio: 0.05

validation:
  logic_tolerance:
    flow_relative: 0.05
    pressure_relative: 0.05
    angle_relative: 0.05

realtime:
  measure_inference: false
  warmup_images: 3
  devices:
    - auto
  cached_inference:
    max_multiplier: 1.35
    cpu_avg_ms: 460.0
    cpu_max_ms: 580.0

model_comparison:
  enabled: true
  device: auto
  methods:
    - key: AE
      label: AE
      kind: reconstruction
      metrics_candidates:
        - D:/pythonProject2/outputs/baseline_p768_b32_lr5e4_cosine/metrics/test_metrics.json
        - D:/pythonProject2/outputs/00_论文总目录_最终版/03_第三章论文输出/03_对比方法原始指标/ae/metrics/test_metrics.json
      checkpoint_candidates:
        - D:/pythonProject2/outputs/baseline_p768_b32_lr5e4_cosine/checkpoints/best_model.pt
    - key: PaDiM
      label: PaDiM
      kind: padim
      metrics_candidates:
        - D:/pythonProject2/outputs/chapter3_feature_benchmarks_final/padim/metrics/test_metrics.json
        - D:/pythonProject2/outputs/00_论文总目录_最终版/03_第三章论文输出/03_对比方法原始指标/padim/metrics/test_metrics.json
    - key: LUAE
      label: LUAE
      kind: reconstruction
      metrics_candidates:
        - D:/pythonProject2/outputs/chapter3_repro/metrics/test_metrics.json
        - D:/pythonProject2/outputs/00_论文总目录_最终版/01_用户训练结果/第三章_LUAE/chapter3_repro/metrics/test_metrics.json
      checkpoint_candidates:
        - D:/pythonProject2/outputs/chapter3_repro/checkpoints/best_model.pt
        - D:/pythonProject2/outputs/00_论文总目录_最终版/01_用户训练结果/第三章_LUAE/chapter3_repro/checkpoints/best_model.pt
